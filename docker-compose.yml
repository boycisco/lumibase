services:
  postgres:
    image: postgres:16-alpine
    container_name: lumibase-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: lumibase
      POSTGRES_PASSWORD: lumibase_dev_password
      POSTGRES_DB: lumibase_dev
    volumes:
      - lumibase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumibase -d lumibase_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: lumibase-anvil
    restart: unless-stopped
    ports:
      - '8545:8545'
    # The foundry image ships with a shell wrapper entrypoint. Setting only
    # `command:` leaves the wrapper in place, and the wrapper does not forward
    # our flags to anvil. Override BOTH entrypoint and command, using exec
    # form for both, so docker runs `anvil --host ... --chain-id ...`
    # directly without any shell in between.
    entrypoint: ['anvil']
    command: ['--host', '0.0.0.0', '--chain-id', '84532', '--accounts', '10']
    healthcheck:
      test: ['CMD-SHELL', 'cast rpc eth_chainId --rpc-url http://localhost:8545 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lumibase_pgdata:
